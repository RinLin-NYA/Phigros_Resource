name: Update game data

on:
  schedule:
    # 每天四次: 北京时间 09:05 / 13:05 / 17:05 / 22:05
    # (鸽游常见发版时段 + 5 分钟余量避开 Actions 整点繁忙期)
    # timezone 为 IANA 时区字符串, 缺省为 UTC; Asia/Shanghai 无夏令时
    - cron: '5 9 * * *'
      timezone: "Asia/Shanghai"
    - cron: '5 13 * * *'
      timezone: "Asia/Shanghai"
    - cron: '5 17 * * *'
      timezone: "Asia/Shanghai"
    - cron: '5 22 * * *'
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      force:
        description: 跳过版本检查，强制重新解包推送
        required: false
        type: boolean
        default: false

concurrency:
  group: update-info-branch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout master
        uses: actions/checkout@v4

      - name: Checkout info branch
        run: |
          git fetch origin info
          git worktree add -B info out origin/info

      - name: Check for new version
        id: check
        env:
          FORCE: ${{ inputs.force || false }}
        run: python ci/check_update.py out/version.txt

      - name: Set up Python
        if: steps.check.outputs.updated == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        if: steps.check.outputs.updated == 'true'
        run: |
          pip install -r requirements.txt
          # fsb5 经 ctypes 加载 vorbis 原生库做 ogg 重编码
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvorbis0a libvorbisenc2 libogg0

      - name: Resolve APK download URL
        if: steps.check.outputs.updated == 'true'
        id: resolve
        run: python ci/resolve_apk_url.py

      - name: Download APK
        if: steps.check.outputs.updated == 'true'
        run: curl -fL -C - --retry 5 --retry-delay 10 --retry-all-errors -o phigros.apk "${{ steps.resolve.outputs.url }}"

      - name: Verify APK checksum
        if: steps.check.outputs.updated == 'true'
        run: echo "${{ steps.resolve.outputs.md5 }}  phigros.apk" | md5sum -c -

      - name: Extract game information and resources
        if: steps.check.outputs.updated == 'true'
        run: |
          python gameInformation.py phigros.apk
          # 关键产物缺失 = 解包不完整（如补丁包结构变化），直接失败终止，
          # 避免把残缺数据推上分支（4.0.1.1 曾因此误删 collection.json）
          for f in info/info.csv info/collection.json info/collection_index.json info/tips.json; do
            if [ ! -s "$f" ]; then
              echo "::error::$f 缺失或为空，解包不完整，终止发布"
              exit 1
            fi
          done
          python resource.py phigros.apk
          for d in avatar chart illustration illustrationLowRes illustrationBlur music; do
            if [ -z "$(ls -A "$d" 2>/dev/null)" ]; then
              echo "::error::$d 目录为空，解包不完整，终止发布"
              exit 1
            fi
          done
          rm -f phigros.apk

      - name: Publish to info branch
        if: steps.check.outputs.updated == 'true'
        run: |
          cd out
          git rm -rq --ignore-unmatch .
          cp ../info/* .
          echo -n "${{ steps.check.outputs.version }}" > version.txt
          git add -A
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "${{ steps.check.outputs.version }}"
          git push origin info

      - name: Publish resource branches
        if: steps.check.outputs.updated == 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for branch in avatar chart illustration illustrationLowRes illustrationBlur music; do
            if git ls-remote --exit-code --heads origin "$branch" > /dev/null 2>&1; then
              git fetch origin "$branch"
              git worktree add -B "$branch" "out_$branch" "origin/$branch"
            else
              git worktree add --detach "out_$branch" HEAD
              git -C "out_$branch" checkout --orphan "$branch"
            fi
            git -C "out_$branch" rm -rfq --ignore-unmatch .
            cp -r "$branch/." "out_$branch/"
            git -C "out_$branch" add -A
            if git -C "out_$branch" diff --cached --quiet; then
              echo "$branch 内容无变化，跳过提交"
            else
              git -C "out_$branch" commit -qm "${{ steps.check.outputs.version }}"
              git -C "out_$branch" push origin "$branch"
            fi
            # 释放磁盘: runner 仅约 14GB, 全量产物超过 4GB
            git worktree remove --force "out_$branch"
            rm -rf "$branch"
          done
